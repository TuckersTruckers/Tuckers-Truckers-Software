name: Portal static checks

on:
  push:
    branches: [feature/separate-carrier-setup-link]
    paths:
      - "portal/**"
      - "supabase/functions/admin-provision-account/**"
      - ".github/workflows/portal-static-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "portal/**"
      - "supabase/functions/admin-provision-account/**"
      - ".github/workflows/portal-static-checks.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check provisioning Edge Function
        run: deno check supabase/functions/admin-provision-account/index.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check inline portal JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [Path("portal/admin.html"), Path("portal/index.html")]
          output = Path("/tmp/portal-script-checks")
          output.mkdir(parents=True, exist_ok=True)
          count = 0

          for target in targets:
              html = target.read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, re.I | re.S)
              for index, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  path = output / f"{target.stem}-{index}.mjs"
                  path.write_text(script, encoding="utf-8")
                  print(f"Checking {target} inline script {index + 1}")
                  count += 1

          if not count:
              raise SystemExit("No inline scripts found to check.")
          PY
          find /tmp/portal-script-checks -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
