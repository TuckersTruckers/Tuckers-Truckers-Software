<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pending Accounts | Tucker's Truckers</title><style>:root{--red:#97343a;--line:#e5e5e5;--muted:#686868}*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#191919;font:15px/1.5 Inter,system-ui,sans-serif}header{background:#202020;color:white;padding:16px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between}a{color:inherit}main{width:min(1050px,calc(100% - 28px));margin:28px auto}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:22px}.row{display:grid;grid-template-columns:1fr 300px;gap:18px;border-top:1px solid var(--line);padding:16px 0}.muted{color:var(--muted);font-size:13px}.notice{padding:12px;background:#fff2e5;border-radius:8px;margin:12px 0}.btn{background:var(--red);color:white;border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer}input{font:inherit;max-width:100%}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><header><b>TUCKER'S TRUCKERS · PENDING ACCOUNTS</b><a href="admin.html">Back to administration</a></header><main><section class="card"><h1>Pending Carrier Accounts</h1><p class="muted">Review submissions, upload the signed Adobe Acrobat Sign agreement, and approve dashboard access.</p><div id="notice" class="notice" hidden></div><div id="list">Loading…</div></section></main>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://bvrlpwkzqmqfcupqjugf.supabase.co','sb_publishable_rK1mYtBCgePRh9gqrn_hwA_7a_zxOLZ');const $=id=>document.getElementById(id);function note(t){$('notice').textContent=t;$('notice').hidden=false}async function init(){const {data:{session}}=await s.auth.getSession();if(!session){location.replace('index.html');return}const {data:a}=await s.rpc('is_portal_admin');if(a!==true){document.querySelector('main').textContent='Administrator access required.';return}const {data:rows,error}=await s.from('carrier_onboarding').select('user_id,review_status,updated_at').in('review_status',['submitted','agreement_sent']).order('updated_at',{ascending:false});if(error){$('list').textContent=error.message;return}$('list').replaceChildren();if(!rows?.length){$('list').textContent='No pending accounts.';return}for(const r of rows){const {data:p}=await s.from('carrier_profiles').select('business_name,dba_name,mc_number,dot_number,contact_name,contact_email,fmcsa_address,fmcsa_phone,fmcsa_email,personal_address,personal_phone,personal_email').eq('user_id',r.user_id).maybeSingle();const row=document.createElement('div');row.className='row';const d=document.createElement('div');const h=document.createElement('h2');h.textContent=p?.business_name||'Carrier account';const details=document.createElement('p');details.className='muted';details.textContent=['MC '+(p?.mc_number||'—')+' · USDOT '+(p?.dot_number||'—'),'DBA '+(p?.dba_name||'—'),'Authorized person '+(p?.contact_name||'—'),'Business '+(p?.fmcsa_address||'—')+' · '+(p?.fmcsa_phone||'—')+' · '+(p?.fmcsa_email||'—'),'Personal '+(p?.personal_address||'—')+' · '+(p?.personal_phone||'—')+' · '+(p?.personal_email||'—')].join('\n');details.style.whiteSpace='pre-line';d.append(h,details);const c=document.createElement('div');const f=document.createElement('input');f.type='file';f.accept='.pdf,.jpg,.jpeg,.png';const b=document.createElement('button');b.className='btn';b.textContent='Upload signed agreement & approve';b.onclick=async()=>{const file=f.files[0];if(!file)return note('Choose the signed agreement first.');if(!['application/pdf','image/jpeg','image/png'].includes(file.type)||file.size>50*1024*1024)return note('Choose a PDF, JPG, or PNG no larger than 50 MB.');b.disabled=true;b.textContent='Uploading…';const path=r.user_id+'/agreement-'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]+/g,'-');const {error:u}=await s.storage.from('carrier-documents').upload(path,file,{contentType:file.type,upsert:false});if(u){b.disabled=false;b.textContent='Upload signed agreement & approve';return note(u.message)}const {error:doc}=await s.from('carrier_documents').insert({user_id:r.user_id,document_type:'carrier_agreement',file_name:file.name,file_path:path,content_type:file.type});if(doc){await s.storage.from('carrier-documents').remove([path]);b.disabled=false;b.textContent='Upload signed agreement & approve';return note(doc.message)}const {error:prog}=await s.from('portal_setup_progress').upsert({user_id:r.user_id,agreement_status:'signed',agreement_signed_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id'});if(prog)return note('Agreement uploaded but progress could not be updated: '+prog.message);const {error:approval}=await s.from('carrier_onboarding').update({agreement_complete:true,review_status:'approved',updated_at:new Date().toISOString()}).eq('user_id',r.user_id);if(approval)return note('Agreement uploaded but approval failed: '+approval.message);note('Agreement uploaded and account approved.');location.reload()};c.append(f,document.createElement('br'),b);row.append(d,c);$('list').append(row)}}await init();</script></body></html>
