<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pending Approvals | Tucker's Truckers</title><style>:root{--red:#97343a;--line:#e5e5e5;--muted:#686868}*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#191919;font:14px/1.55 Inter,system-ui,sans-serif}header{background:#202020;color:#fff;padding:14px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between}header a{color:#fff}main{width:min(1050px,calc(100% - 28px));margin:28px auto}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding:16px 0}.muted{color:var(--muted);font-size:12px}.btn{display:inline-block;background:var(--red);color:white;border:0;border-radius:8px;padding:10px 13px;font-weight:800;text-decoration:none}@media(max-width:620px){.row{align-items:flex-start;flex-direction:column}}</style></head><body><header><b>TUCKER'S TRUCKERS · PENDING APPROVALS</b><a href="carriers.html">Back to carriers</a></header><main><section class="card"><h1>Pending Approvals</h1><p class="muted">These are carriers who submitted their initial details themselves. Open a record to review the submission, upload the signed agreement, and approve access. They do not need another password setup email.</p><div id="notice" class="muted">Loading submissions…</div><div id="list"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://bvrlpwkzqmqfcupqjugf.supabase.co','sb_publishable_rK1mYtBCgePRh9gqrn_hwA_7a_zxOLZ');const $=id=>document.getElementById(id);async function init(){const {data:{session}}=await s.auth.getSession();if(!session){location.replace('index.html');return}const {data:a}=await s.rpc('is_portal_admin');if(a!==true){document.querySelector('main').textContent='Administrator access required.';return}const {data:rows,error}=await s.from('carrier_onboarding').select('user_id,review_status,updated_at').eq('review_status','pending').order('updated_at',{ascending:false});if(error){$('notice').textContent=error.message;return}$('notice').textContent=rows?.length?rows.length+' carrier submission(s) awaiting review.':'No pending carrier approvals.';for(const r of rows||[]){const {data:p}=await s.from('carrier_profiles').select('business_name,mc_number,dot_number,contact_name,contact_email').eq('user_id',r.user_id).maybeSingle();const row=document.createElement('div');row.className='row';const info=document.createElement('div');const h=document.createElement('strong');h.textContent=p?.business_name||'Carrier submission';const meta=document.createElement('div');meta.className='muted';meta.textContent='MC '+(p?.mc_number||'—')+' · USDOT '+(p?.dot_number||'—')+' · '+(p?.contact_name||p?.contact_email||'Contact not entered');info.append(h,meta);const a=document.createElement('a');a.className='btn';a.href='carrier-detail.html?id='+encodeURIComponent(r.user_id);a.textContent='Review carrier';row.append(info,a);$('list').append(row)}}await init();</script></body></html>
