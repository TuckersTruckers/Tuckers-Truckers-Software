<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Website Inquiries | Tucker's Truckers</title><style>:root{--red:#97343a;--line:#e5e5e5;--muted:#686868}*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#191919;font:14px/1.55 Inter,system-ui,sans-serif}header{background:#202020;color:#fff;padding:14px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between}header a{color:#fff}main{width:min(1050px,calc(100% - 28px));margin:26px auto}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px}.item{padding:15px 0;border-top:1px solid var(--line)}.muted{color:var(--muted);font-size:12px}.message{white-space:pre-wrap;background:#fafafa;border-radius:8px;padding:12px;margin-top:8px}</style></head><body><header><b>TUCKER'S TRUCKERS · WEBSITE INQUIRIES</b><a href="carriers.html">Back to carriers</a></header><main><section class="card"><h1>Website Inquiries</h1><p class="muted">Submissions from the public website contact form.</p><div id="notice" class="muted">Loading inquiries…</div><div id="list"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://bvrlpwkzqmqfcupqjugf.supabase.co','sb_publishable_rK1mYtBCgePRh9gqrn_hwA_7a_zxOLZ');const $=id=>document.getElementById(id);async function init(){const {data:{session}}=await s.auth.getSession();if(!session){location.replace('index.html');return}const {data:a}=await s.rpc('is_portal_admin');if(a!==true){document.querySelector('main').textContent='Administrator access required.';return}const {data,error}=await s.from('website_inquiries').select('*').order('submitted_at',{ascending:false});if(error){$('notice').textContent=error.message;return}$('notice').textContent=(data||[]).length+' website inquiry/inquiries';for(const x of data||[]){const item=document.createElement('article');item.className='item';const h=document.createElement('h2');h.textContent=x.company||x.name;const meta=document.createElement('div');meta.className='muted';meta.textContent=[x.name,x.email,x.phone,x.mc_number?'MC '+x.mc_number:'',x.fleet_size?'Fleet '+x.fleet_size:'',new Date(x.submitted_at).toLocaleString(),'Email notification: '+x.email_notification_status].filter(Boolean).join(' · ');const details=document.createElement('div');details.className='muted';details.textContent='Support requested: '+x.support_requested+' · Equipment: '+(x.equipment_types||[]).join(', ');const msg=document.createElement('div');msg.className='message';msg.textContent=x.inquiry_message||'No additional message';item.append(h,meta,details,msg);$('list').append(item)}}await init();</script></body></html>
