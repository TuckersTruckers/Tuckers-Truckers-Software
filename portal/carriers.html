<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Carriers | Tucker's Truckers</title><style>:root{--red:#97343a;--ink:#191919;--muted:#686868;--line:#e5e5e5}*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:var(--ink);font:14px/1.55 Inter,system-ui,sans-serif}header{background:#202020;color:#fff;padding:14px max(18px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header a{color:#fff;text-decoration:none;font-weight:750}main{width:min(1180px,calc(100% - 28px));margin:26px auto}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;margin-bottom:16px}.hero{background:#202020;color:#fff}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#ddd}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar input{flex:1;min-width:220px}.btn,input{font:inherit}input{padding:10px 12px;border:1px solid #d6d6d6;border-radius:8px}.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#222;border:1px solid var(--line)}.carrier{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line)}.carrier h2{font-size:16px;margin:0}.meta{color:var(--muted);font-size:12px}.status{display:inline-block;border-radius:99px;padding:4px 9px;background:#f2eeee;color:#793238;font-size:11px;font-weight:800;margin-top:5px}@media(max-width:650px){.carrier{align-items:flex-start;flex-direction:column}}</style></head><body><header><b>TUCKER'S TRUCKERS · CARRIER MANAGEMENT</b><a href="dashboard.html">← Dashboard</a></header><main><section class="hero"><h1>Carriers</h1><p>All carrier records, whether manually created or submitted through the public onboarding form.</p></section><section class="card"><div class="toolbar"><input id="search" placeholder="Search company, MC, USDOT, or contact"><a class="btn" href="admin.html#carrier-form">New Carrier Setup</a><a class="btn secondary" href="pending-accounts.html">Pending Approvals</a></div><div id="notice" class="muted">Loading carrier records…</div><div id="list"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://bvrlpwkzqmqfcupqjugf.supabase.co','sb_publishable_rK1mYtBCgePRh9gqrn_hwA_7a_zxOLZ');const $=id=>document.getElementById(id);let rows=[];async function init(){const {data:{session}}=await s.auth.getSession();if(!session){location.replace('index.html');return}const {data:a}=await s.rpc('is_portal_admin');if(a!==true){document.querySelector('main').textContent='Administrator access required.';return}const {data,error}=await s.from('carrier_profiles').select('user_id,business_name,contact_name,contact_email,mc_number,dot_number,onboarding_mode,admin_setup_complete,setup_link_sent_at').order('business_name');if(error){$('notice').textContent=error.message;return}rows=data||[];for(const r of rows){const {data:o}=await s.from('carrier_onboarding').select('review_status').eq('user_id',r.user_id).maybeSingle();r.review_status=o?.review_status||null}render()}function render(){const q=$('search').value.toLowerCase();const list=$('list');list.replaceChildren();const found=rows.filter(r=>[r.business_name,r.contact_name,r.contact_email,r.mc_number,r.dot_number].join(' ').toLowerCase().includes(q));$('notice').textContent=found.length+' carrier record(s)';if(!found.length){list.textContent='No matching carrier records.';return}for(const r of found){const row=document.createElement('div');row.className='carrier';const info=document.createElement('div');const h=document.createElement('h2');h.textContent=r.business_name||'Unnamed carrier';const meta=document.createElement('div');meta.className='meta';meta.textContent='MC '+(r.mc_number||'—')+' · USDOT '+(r.dot_number||'—')+' · '+(r.contact_name||r.contact_email||'Contact not entered');const status=document.createElement('span');status.className='status';status.textContent=r.review_status==='pending'?'Pending approval':r.review_status==='approved'?'Approved':r.onboarding_mode==='admin_assisted'?(r.setup_link_sent_at?'Manual account · setup email sent':'Manual account · setup email not sent'):'Self-service account';info.append(h,meta,status);const action=document.createElement('a');action.className='btn secondary';action.href='carrier-detail.html?id='+encodeURIComponent(r.user_id);action.textContent='Open carrier';row.append(info,action);list.append(row)}}$('search').addEventListener('input',render);await init();</script></body></html>
